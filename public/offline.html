<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141415">
  <title>Acture — offline</title>
  <style>
    :root { color-scheme: light dark; --bg: #fefffe; --fg: #1a1b1e; --muted: #6b6d73; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141415; --fg: #f5f4f2; --muted: #9b9b9f; } }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--fg);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    }
    main { max-width: 320px; text-align: center; }
    svg { width: 48px; height: 48px; margin-bottom: 20px; }
    h1 { font-size: 20px; letter-spacing: -0.01em; margin: 0 0 6px; }
    p { margin: 0 0 22px; color: var(--muted); }
    button {
      font: inherit; font-weight: 600; cursor: pointer;
      padding: 9px 16px; border-radius: 10px; border: 0;
      background: var(--fg); color: var(--bg);
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="9" fill="#141413"/>
      <g transform="translate(5.4 5.4) scale(0.66)" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 14.5v3" stroke="#F5A524"/><path d="M9.5 11.5v9" stroke="#F5A524"/><path d="M14 16.5l4 4L27.5 10" stroke="#fff"/>
      </g>
    </svg>
    <h1>You’re offline</h1>
    <p>Acture needs a connection to reach your lists. They’re safe — it’ll pick up where you left off.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
